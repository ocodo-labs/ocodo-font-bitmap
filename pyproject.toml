[project]
name = "ocodo-font-bitmap"
version = "0.1.0"
description = "Generate Linux PSF2 bitmap console fonts from Ocodo Mono TTF sources"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Jason Milkins" },
]
dependencies = [
    "freetype-py>=2.5.0",
]

[project.scripts]
ocodo-bitmap = "ocodo_font_bitmap.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ocodo_font_bitmap"]

[tool.hatch.version]
path = "src/ocodo_font_bitmap/__init__.py"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
